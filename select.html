<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>테라리움 선택</title>
<style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
        font-family: "Malgun Gothic", "맑은 고딕", sans-serif;
        background:#dbdbdb;
        color: #202020;
        height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        overflow: hidden;
    }

    h1 {
        font-size: 34px;
        letter-spacing: 2px;
        margin-bottom: 8px;
    }

    .sub {
        font-size: 15px;
        opacity: 0.8;
        margin-bottom: 36px;
    }

    .cards {
        display: flex;
        gap: 28px;
    }

    .card {
        width: 210px;
        padding: 22px 18px 20px;
        border: 2px solid rgba(255, 255, 255, 0.18);
        border-radius: 22px;
        background: rgba(255, 255, 255, 0.08);
        color: inherit;
        font-family: inherit;
    }

    .card:hover {
        background: rgba(255, 255, 255, 0.16);
        border-color: #c8f0b4;
    }

    .card img {
        width: 160px;
        height: 160px;
        object-fit: contain;
        display: block;
        margin: 0 auto 14px;
    }

    .name {
        font-size: 20px;
        font-weight: bold;
    }

    .desc {
        font-size: 13px;
        opacity: 0.75;
        margin-top: 4px;
    }
</style>
</head>
<body>
    <h1>테라리움을 골라주세요</h1>
    <div class="cards">
        <button class="card" onclick="pick('bowl')">
            <img src="images/bowl.png" alt="bowl">
            <div class="name">Bowl</div>
            <div class="desc">어항</div>
        </button>

        <button class="card" onclick="pick('house')">
            <img src="images/house.png" alt="house">
            <div class="name">House</div>
            <div class="desc">집</div>
        </button>

        <button class="card" onclick="pick('rium')">
            <img src="images/rium.png" alt="rium">
            <div class="name">Rium</div>
            <div class="desc">병</div>
        </button>

        <button class="card" onclick="pick('coffee')">
            <img src="images/coffee.png" alt="coffee">
            <div class="name">Coffee</div>
            <div class="desc">커피잔</div>
        </button>
    </div>

<script>
    function pick(type) {
        if (window.app) {
            app.select(type);
        }
    }
</script>
</body>
</html>
